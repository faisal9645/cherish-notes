name: Android Release & OTA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: Build & Release OTA APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets and Keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "=== GRADLE BUILD FAILED. LOG TAIL: ==="
            tail -n 120 build.log
            exit 1
          }

      - name: Prepare Single OTA Asset
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          echo "Target VERSION_CODE is $VERSION_CODE"
          mkdir -p app/build/outputs/apk/release
          echo "All APKs generated by build:"
          find app/build -type f -name "*.apk" || true
          APK_FILE=$(find app/build -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Copying release APK from $APK_FILE to app/build/outputs/apk/release/app_update_${VERSION_CODE}.apk"
            cp "$APK_FILE" "app/build/outputs/apk/release/app_update_${VERSION_CODE}.apk"
          else
            echo "ERROR: No APK found anywhere under app/build!"
            exit 1
          fi
          # Remove any other APKs in release directory so only the single update APK exists
          find app/build/outputs/apk/release -type f ! -name "app_update_${VERSION_CODE}.apk" -name "*.apk" -delete || true
          ls -la app/build/outputs/apk/release/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-release-apk
          path: app/build/outputs/apk/release/app_update_*.apk
          retention-days: 30

      - name: Create GitHub Release for OTA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          TAG_NAME="v${VERSION_NAME}-${VERSION_CODE}"
          UPDATE_APK="app/build/outputs/apk/release/app_update_${VERSION_CODE}.apk"

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading $UPDATE_APK..."
            for asset in $(gh release view "$TAG_NAME" --json assets --jq '.assets[].name'); do
              if [ "$asset" != "app_update_${VERSION_CODE}.apk" ]; then
                echo "Removing extra asset $asset from release $TAG_NAME..."
                gh release delete-asset "$TAG_NAME" "$asset" -y || true
              fi
            done
            gh release upload "$TAG_NAME" "$UPDATE_APK" --clobber
          else
            echo "Creating new release $TAG_NAME with single OTA APK..."
            gh release create "$TAG_NAME" \
              --title "v${VERSION_NAME} (build ${VERSION_CODE})" \
              --notes "Automated OTA update for version $VERSION_NAME (Build $VERSION_CODE)" \
              "$UPDATE_APK"
          fi

          echo "Purging jsdelivr cache for version.json..."
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/version.json" || true
